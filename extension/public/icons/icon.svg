<svg
  xmlns="http://www.w3.org/2000/svg"
  width="2400"
  height="2400"
  viewBox="0 0 24 24"
  role="img"
  aria-label="Bello Code Reviewer"
>
  <title>Bello Code Reviewer</title>

  <!-- Outer button -->
  <circle cx="12" cy="12" r="12" fill="#0f0f13" />

  <!-- Sclera -->
  <circle cx="12" cy="12" r="9.5" fill="#ffffff" />

  <!-- Eyelid accent -->
  <path d="M3.923 7 A9.5 9.5 0 0 1 20.077 7 Z" fill="#f5e050" />

  <!-- Code brackets -->
  <polyline
    points="9.2 8.7 7.4 12 9.2 15.3"
    fill="none"
    stroke="#0f0f13"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <polyline
    points="14.8 8.7 16.6 12 14.8 15.3"
    fill="none"
    stroke="#0f0f13"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Pupil -->
  <circle cx="12" cy="12" r="2.8" fill="#0f0f13" />
</svg>

